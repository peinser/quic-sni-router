name: CI
run-name: ${{ github.actor }} is validating quic-sni-router

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - development
  pull_request:

jobs:
  publish:
    needs: [helm-test, build-test, release-build-test, sanitize, fuzz-smoke, docker-e2e, loadtest, static-analysis]
    # Default success() gating includes every matrix leg. Failed or cancelled
    # validation cannot publish; manual runs must go through this workflow too.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yaml
    secrets: inherit

  helm-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: "3.17.3"
    - name: Install YAML parser
      run: sudo apt-get update && sudo apt-get install -y python3-yaml
    - name: Lint and test chart rendering
      run: |
        helm lint charts/quic-sni-router
        /usr/bin/python3 tests/helm/render.py
        /usr/bin/python3 tests/helm/publication.py

  build-test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc-14]
    # PR code runs only on disposable GitHub-hosted VMs.
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Setup dependencies
      uses: ./.github/actions/setup-deps
      with:
        extras: clang gcc-14 cppcheck clang-tidy
    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.compiler }}
    - name: Build
      run: cmake --build build
    - name: Test
      run: ctest --test-dir build --output-on-failure

  release-build-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Setup dependencies
      uses: ./.github/actions/setup-deps
      with:
        extras: clang
    - name: Configure Release
      run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
    - name: Build Release
      run: cmake --build build-release
    - name: Test Release
      run: ctest --test-dir build-release --output-on-failure

  sanitize:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Setup dependencies
      uses: ./.github/actions/setup-deps
      with:
        extras: clang-18 libclang-rt-18-dev
    - name: Sanitize
      run: make sanitize CLANG=clang-18

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Setup dependencies
      uses: ./.github/actions/setup-deps
      with:
        extras: clang-18 libclang-rt-18-dev
    - name: Fuzz smoke
      run: make fuzz-smoke CLANG=clang-18

  docker-e2e:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    # No registry login: the e2e images build from public bases, so this job
    # also runs on pull requests from forks, which have no access to secrets.
    - name: Docker HTTP/3 e2e
      run: make test-e2e
    - name: Docker per-flow upstream isolation e2e
      run: make test-e2e-flows
    - name: Docker fragmented-Initial e2e
      run: make test-e2e-fragmented
    - name: Docker backend-idle e2e
      run: make test-e2e-idle
    - name: Docker reverse-tuple e2e
      run: make test-e2e-reverse
    - name: Docker NAT-rebind e2e
      run: make test-e2e-rebind
    - name: Docker hot-reload e2e
      run: make test-e2e-reload
    - name: Docker IPv6 reply-routing e2e (no fwmark)
      run: make test-e2e-ipv6-routing

  loadtest:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Docker loadtest (10 backends, sustained concurrent QUIC)
      # Correctness-under-load: 10 aioquic backends, 10 concurrent workers
      # for 30s of fresh handshakes each. Pass requires zero misrouted
      # responses AND success rate >= 95%. Tune via env vars.
      run: make test-loadtest
    - name: Docker persistent-session loadtest
      # Established-session forwarding: each worker keeps one QUIC/HTTP/3
      # connection open and sends repeated requests on new streams.
      run: QSR_LOADTEST_PERSISTENT=1 make test-loadtest

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Setup dependencies
      uses: ./.github/actions/setup-deps
      with:
        extras: clang clang-tidy cppcheck
    - name: Lint
      run: make lint

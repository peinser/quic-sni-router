{{- if .Values.config.cidEncoding }}
{{- fail "CID keys must not be supplied in Helm values; use existingSecret with a complete router.yaml" }}
{{- end }}
{{- range (.Values.config.quicLb).configurations }}
{{- if hasKey . "key" }}
{{- fail "QUIC-LB keys must not be supplied in Helm values; use existingSecret with a complete router.yaml" }}
{{- end }}
{{- end }}
{{- if and .Values.configMap.create (not .Values.existingSecret) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quic-sni-router.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quic-sni-router.labels" . | nindent 4 }}
data:
  # router.yaml — consumed by the router via inotify on this file's directory.
  # Changes propagate without a pod restart unless configMap.checksumAnnotation
  # is on, in which case the Deployment template carries a content hash and
  # Helm will roll the pods on upgrade.
  router.yaml: |
    listen:
      udp: {{ .Values.config.listen.udp | quote }}
      fwmark: {{ .Values.config.listen.fwmark | default 0 | int64 }}
    sessions:
      idleTimeout: {{ .Values.config.sessions.idleTimeout | quote }}
      maxSessions: {{ .Values.config.sessions.maxSessions }}
    {{- with .Values.config.quicLb }}
    quicLb:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    routes:
      {{- if .Values.config.routes }}
      {{- range $sni, $route := .Values.config.routes }}
      {{ $sni }}:
        host: {{ required (printf "config.routes.%s.host is required" $sni) $route.host | quote }}
        port: {{ required (printf "config.routes.%s.port is required" $sni) $route.port }}
        {{- with $route.serverId }}
        serverId: {{ . }}
        {{- end }}
        {{- with $route.quicLbServerIds }}
        quicLbServerIds:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- else }} {}
      {{- end }}
    {{- if (.Values.config.logging).connections }}
    logging:
      connections: true
    {{- end }}
{{- end }}

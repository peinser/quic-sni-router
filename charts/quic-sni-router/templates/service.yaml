apiVersion: v1
kind: Service
metadata:
  name: {{ include "quic-sni-router.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quic-sni-router.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ .Values.service.loadBalancerClass }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort") }}
  # Cluster lets kube-proxy SNAT clients to node addresses; Local preserves the
  # client source IP. Transparent mode is useless and breaks replies without
  # real client addresses, so config.listen.transparent forces Local.
  externalTrafficPolicy: {{ .Values.config.listen.transparent | ternary "Local" .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: quic
      port: {{ .Values.service.port }}
      targetPort: quic
      protocol: UDP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "quic-sni-router.selectorLabels" . | nindent 4 }}

listen:
  udp: ":443"
  fwmark: 0 # Optional Linux SO_MARK; nonzero requires capability + policy rules. Restart required.
  transparent: false # Optional Linux client source tuple; requires capability + return route. Restart required.
sessions:
  idleTimeout: 60s
  maxSessions: 10000
routes:
  rvr-a.flightdeck.example.test:
    host: rvr-a
    port: 8443
  rvr-b.flightdeck.example.test:
    host: rvr-b
    port: 8444
